[package]
name = "papyrus"
version = "0.1.0"
description = "Papyrus PDF viewer"
authors = ["coyotekojote"]
edition = "2021"

[lib]
name = "papyrus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Platform-native credential stores only: no extra daemon, no bundled crypto.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
# Translation providers are called from Rust, so the API key never reaches the
# WebView (see translation.rs). rustls rather than the platform TLS stack: one
# behaviour to reason about on every target, and no OpenSSL to build.
#
# Kept on the major version tauri itself depends on: a second reqwest would be
# compiled into the binary alongside the one already there.
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tempfile = "3"

# Already in the tree via keyring. Used only to ask whether a key exists
# without reading it, which is what keeps the settings screen from putting a
# keychain prompt in front of the reader — see keychain.rs.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

# Security-scoped bookmarks (bookmarks.rs) have no Tauri plugin support, so
# NSURL is called directly. iOS-only: on macOS the same feature would need the
# `.withSecurityScope` creation option, which does not exist on iOS, so the
# two platforms are not sharing this code path.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSData",
  "NSError",
  "NSObject",
  "NSString",
  "NSURL",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
