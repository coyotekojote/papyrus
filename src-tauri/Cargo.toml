[package]
name = "papyrus"
version = "0.1.0"
description = "Papyrus PDF viewer"
authors = ["coyotekojote"]
edition = "2021"

[lib]
name = "papyrus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Platform-native credential stores only: no extra daemon, no bundled crypto.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
# Translation providers are called from Rust, so the API key never reaches the
# WebView (see translation.rs). rustls rather than the platform TLS stack: one
# behaviour to reason about on every target, and no OpenSSL to build.
reqwest = { version = "0.12", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tempfile = "3"

# Already in the tree via keyring. Used only to ask whether a key exists
# without reading it, which is what keeps the settings screen from putting a
# keychain prompt in front of the reader — see keychain.rs.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
